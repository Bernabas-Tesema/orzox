services:
  - type: web
    name: orzo-backend
    runtime: docker
    rootDir: backend1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: sh -c "python manage.py migrate --noinput && python manage.py create_deploy_admin && gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 1 --timeout 120"
    healthCheckPath: /api
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ADMIN_EMAIL
        value: "admin@orzo.et"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: orzo-postgres
          property: connectionString
      - key: PORTAL_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

databases:
  - name: orzo-postgres
    databaseName: orzo_db
    user: orzo
