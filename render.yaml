services:
  - type: web
    name: orzo-portal
    runtime: node
    rootDir: frontend1
    buildCommand: npm install && npm run build:all
    startCommand: node app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: PLATFORM_ADMIN_EMAIL
        value: "orozo@gmail.com"
      - key: PLATFORM_ADMIN_PASSWORD
        value: "orozo@2026"
      - key: DATABASE_URL
        fromDatabase:
          name: orzo-postgres
          property: connectionString
      - key: DB_ENGINE
        value: postgresql
      - key: DJANGO_API_URL
        value: "https://orzox-1.onrender.com"
      - key: LIVEKIT_URL
        value: "wss://orozo-translation-8nvelq7r.livekit.cloud"
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HASAB_API_KEY
        sync: false

  - type: web
    name: orzo-backend
    runtime: python
    rootDir: backend1
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py create_deploy_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ADMIN_EMAIL
        value: "admin@orzo.et"
      - key: ADMIN_PASSWORD
        value: "Orzo-Admin-2026!"
      - key: DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: orzo-postgres
          property: connectionString
      - key: PORTAL_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

databases:
  - name: orzo-postgres
    databaseName: orzo_db
    user: orzo
